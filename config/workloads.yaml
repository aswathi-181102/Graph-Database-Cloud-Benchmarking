# Workload parameters, applied identically to every platform. Nothing here is
# tuned per engine. Reasoning for each value: docs/DECISIONS.md sections 4-8.

load:
  # A guess until `graphbench calibrate` has run against the capped containers;
  # the measured sweep goes in docs/CALIBRATION.md and this changes if it says so.
  # Too small and per-request overhead dominates, too large and a 256 MB engine
  # spills, at which point it measures the memory cap and not ingest speed.
  batch_size: 5000

reads:
  iterations: 100
  warmup: 20

  # RETURN 1 on every platform. CognoDB is on the internet, the capped engines are
  # on loopback, so without this the traversal comparison is partly a speed test
  # of my broadband.
  baseline_query: true

  # k-hop neighbourhood (nodes within 1..k hops), not nodes at exactly depth k.
  # Cypher uses relationship uniqueness and AQL uses vertex uniqueness, and the
  # neighbourhood is the one definition both express exactly. Also monotonic, so
  # 1-hop <= 2-hop <= 3-hop is a free correctness check.
  hops: [1, 2, 3]

  # Per-query ceiling. Overruns are recorded as timeouts, never silently dropped
  # or retried, since how often an engine times out is itself a result.
  timeout_s: 30

mixed:
  concurrency: [1, 10, 40]
  duration_s: 30
  # Agent context graphs are read dominated: constant reads, occasional appends.
  read_ratio: 0.9
  cleanup_writes: true

lookups:
  # min_degree just under the measured mean degree of 21, so the predicate is
  # actually selective rather than matching everything or nothing.
  cohort: 7
  min_degree: 10
