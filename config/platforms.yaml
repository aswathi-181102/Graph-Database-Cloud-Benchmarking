# Platforms under test. No secrets: every credential is an ${ENV_VAR} reference
# resolved at load time, so a missing variable is a skip, not a leak or a crash.
#
# Why these five comparators, what was rejected, and why there are two tracks:
# docs/DECISIONS.md sections 1 and 2.
#
# Short version: track "local" is Docker with every engine capped to CognoDB's
# 0.5 vCPU / 256 MB, and that is the resource-fair comparison. Track "cloud" is
# managed free tiers as they actually ship, which are not equal to each other and
# are labelled as such. Track "reference" is Kuzu, embedded, not ranked.

defaults:
  dataset: ca-astroph

platforms:
  # ---------------------------------------------------------------- cloud ----
  - id: cognodb-cloud
    display: CognoDB Cloud (c0 free)
    engine: cognodb
    adapter: bolt
    track: cloud
    tier:
      name: c0 free
      vcpu: 0.5
      ram_mb: 256
      disk_gb: 1
      # Burstable matters: a 100-iteration read loop can drain a CPU credit
      # balance, and the tail latency then reflects throttling, not the engine.
      burstable: true
      source: https://cognodb.com/pricing
    connection:
      uri: ${COGNODB_URI}
      user: ${COGNODB_USER:-cognodb}
      password: ${COGNODB_PASSWORD}
      # Bolt engines that are not Neo4j reject the database parameter.
      database: ${COGNODB_DATABASE:-}

  - id: neo4j-aura
    display: Neo4j AuraDB Free
    engine: neo4j
    adapter: bolt
    track: cloud
    tier:
      name: AuraDB Free
      vcpu: null          # not published
      ram_mb: 1024        # advertised, 4x CognoDB's, hence the two tracks
      disk_gb: 2
      burstable: true
      notes: >
        Also capped at 200k nodes / 400k relationships. ca-AstroPh fits, but a
        larger dataset would have been refused by the tier, not the hardware.
      source: https://neo4j.com/pricing/
    connection:
      uri: ${NEO4J_AURA_URI}
      user: ${NEO4J_AURA_USER:-neo4j}
      password: ${NEO4J_AURA_PASSWORD}
      database: ${NEO4J_AURA_DATABASE:-neo4j}

  - id: memgraph-cloud
    display: Memgraph Cloud (free)
    engine: memgraph
    adapter: bolt
    track: cloud
    tier:
      name: free
      vcpu: null
      ram_mb: 2048        # advertised
      disk_gb: null
      burstable: true
      source: https://memgraph.com/pricing
    connection:
      uri: ${MEMGRAPH_CLOUD_URI}
      user: ${MEMGRAPH_CLOUD_USER:-}
      password: ${MEMGRAPH_CLOUD_PASSWORD}
      database: ""

  - id: arango-cloud
    display: ArangoGraph (trial)
    engine: arangodb
    adapter: arango
    track: cloud
    tier:
      name: trial
      vcpu: null
      ram_mb: null
      disk_gb: null
      source: https://arangodb.com/pricing/
    connection:
      url: ${ARANGO_CLOUD_URL}
      user: ${ARANGO_CLOUD_USER:-root}
      password: ${ARANGO_CLOUD_PASSWORD}
      database: ${ARANGO_CLOUD_DB:-_system}

  - id: falkordb-cloud
    display: FalkorDB Cloud (free)
    engine: falkordb
    adapter: falkor
    track: cloud
    tier:
      name: free
      vcpu: null
      ram_mb: 30          # advertised free tier is tiny, may not fit the graph
      disk_gb: null
      source: https://www.falkordb.com/pricing/
    connection:
      host: ${FALKORDB_CLOUD_HOST}
      port: ${FALKORDB_CLOUD_PORT:-6379}
      password: ${FALKORDB_CLOUD_PASSWORD}

  # ---------------------------------------------------------------- local ----
  # Caps and pinned image tags live in docker-compose.yml.
  - id: neo4j-local
    container: gb-neo4j
    data_dir: /data
    display: Neo4j 5 Community (capped)
    engine: neo4j
    adapter: bolt
    track: local
    tier:
      name: docker 0.5cpu/256m
      vcpu: 0.5
      ram_mb: 256
      disk_gb: 1
      source: docker-compose.yml
    connection:
      uri: ${LOCAL_NEO4J_URI:-bolt://localhost:7687}
      user: ${LOCAL_NEO4J_USER:-neo4j}
      password: ${LOCAL_NEO4J_PASSWORD:-benchpass123}
      database: neo4j

  - id: memgraph-local
    container: gb-memgraph
    data_dir: /var/lib/memgraph
    display: Memgraph (capped)
    engine: memgraph
    adapter: bolt
    track: local
    tier:
      name: docker 0.5cpu/256m
      vcpu: 0.5
      ram_mb: 256
      disk_gb: 1
      source: docker-compose.yml
    connection:
      uri: ${LOCAL_MEMGRAPH_URI:-bolt://localhost:7688}
      user: ${LOCAL_MEMGRAPH_USER:-}
      password: ${LOCAL_MEMGRAPH_PASSWORD:-}
      database: ""

  - id: arango-local
    container: gb-arangodb
    data_dir: /var/lib/arangodb3
    display: ArangoDB (capped)
    engine: arangodb
    adapter: arango
    track: local
    tier:
      name: docker 0.5cpu/256m
      vcpu: 0.5
      ram_mb: 256
      disk_gb: 1
      source: docker-compose.yml
    connection:
      url: ${LOCAL_ARANGO_URL:-http://localhost:8529}
      user: ${LOCAL_ARANGO_USER:-root}
      password: ${LOCAL_ARANGO_PASSWORD:-benchpass123}
      database: ${LOCAL_ARANGO_DB:-_system}

  - id: falkordb-local
    container: gb-falkordb
    data_dir: /data
    display: FalkorDB (capped)
    engine: falkordb
    adapter: falkor
    track: local
    tier:
      name: docker 0.5cpu/256m
      vcpu: 0.5
      ram_mb: 256
      disk_gb: 1
      source: docker-compose.yml
    connection:
      host: ${LOCAL_FALKORDB_HOST:-localhost}
      port: ${LOCAL_FALKORDB_PORT:-6380}
      password: ${LOCAL_FALKORDB_PASSWORD:-}

  # ------------------------------------------------------------ reference ----
  # In-process, so no Bolt round trip. Not ranked with the others; the gap between
  # this and the Bolt engines is protocol cost rather than engine cost.
  - id: kuzu-embedded
    display: Kuzu (embedded, reference only)
    engine: kuzu
    adapter: kuzu
    track: reference
    tier:
      name: in-process, 256 MB buffer pool, 1 thread
      vcpu: null          # cannot cap CPU on an in-process library
      ram_mb: 256         # enforced via buffer_pool_size
      disk_gb: 1
      source: graphbench/adapters/kuzu.py
    connection:
      path: ${KUZU_DB_PATH:-data/kuzu/bench.kz}
      buffer_pool_mb: ${KUZU_BUFFER_POOL_MB:-256}
      threads: ${KUZU_THREADS:-1}
