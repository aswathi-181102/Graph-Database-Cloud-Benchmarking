[project]
name = "graphbench"
version = "0.1.0"
description = "Benchmark harness comparing CognoDB Cloud against other managed graph databases"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }

# exact pins: if the client driver moves, the latency numbers stop being
# comparable to the ones already in results/.
#
# Upper bound on python is not caution, it is a wheel gap: kuzu 0.11.3 ships no
# macOS cp314 wheel and building it from source fails. Pinning to a python where
# every dependency has a wheel is worth more here than being on the newest one.
dependencies = [
    "neo4j==5.28.4",
    "FalkorDB==1.7.1",
    "python-arango==8.3.3",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.3",
    "matplotlib==3.10.9",
    "kuzu==0.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[project.scripts]
graphbench = "graphbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
# The transport half of each adapter needs a live engine and is covered by real
# runs against the capped containers, not by unit tests. Mocking a Bolt session
# would test the mock. Query construction, which is where a silent regression
# would change what the metric means, is unit tested in
# tests/test_adapter_queries.py.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
