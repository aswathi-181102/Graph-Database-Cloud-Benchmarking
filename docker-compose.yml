# The resource-matched track: every engine at 0.5 vCPU / 256 MB, CognoDB's free
# c0 envelope. Tags are pinned to exact patches so a rerun is comparable.
#
# What each engine needed before it would fit, and what is not enforced:
# docs/LOCAL_STACK.md.
#
# benchpass123 is a throwaway for containers bound to localhost that `make down`
# destroys. Not the same class of thing as the cloud credentials, which are never
# in this repo.

x-caps: &caps
  cpus: 0.5
  mem_limit: 256m
  restart: "no"

services:
  neo4j:
    <<: *caps
    image: neo4j:5.26.29-community
    container_name: gb-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/benchpass123
      # Neo4j sizes heap and page cache from host RAM, so on defaults it asks for
      # a ~2 GB heap and is killed before it logs anything. 96m + 48m is the
      # tightest split that boots. server.metrics.* is deliberately absent:
      # Enterprise-only, and Community refuses to start on an unknown key.
      NEO4J_server_memory_heap_initial__size: 96m
      NEO4J_server_memory_heap_max__size: 96m
      NEO4J_server_memory_pagecache_size: 48m
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_bolt_thread__pool__max__size: "40"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # TCP probe, not cypher-shell: that is a second JVM and would OOM the
      # database it is meant to be checking.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7687'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  memgraph:
    <<: *caps
    image: memgraph/memgraph:3.12.0
    container_name: gb-memgraph
    command:
      # Below the container limit on purpose, so Memgraph refuses a query with an
      # error naming it rather than being OOM-killed by the kernel.
      - "--memory-limit=200"
      # Durability off, which is what Memgraph documents for query benchmarking.
      # A real asymmetry against Neo4j and ArangoDB, which are left durable, and it
      # is repeated next to Memgraph's numbers in the results.
      - "--storage-snapshot-interval-sec=0"
      - "--storage-wal-enabled=false"
      - "--telemetry-enabled=false"
      - "--log-level=WARNING"
    ports:
      - "7688:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7687'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  arangodb:
    <<: *caps
    image: arangodb:3.12.10.1
    container_name: gb-arangodb
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: benchpass123
    command:
      - "arangod"
      # 64 MiB is the floor, not a preference: 32 MiB is rejected with "invalid
      # value" and the server refuses to start. So ArangoDB cannot be tuned as
      # tightly as the others, which is itself a result at this tier.
      - "--rocksdb.total-write-buffer-size=67108864"
      - "--rocksdb.write-buffer-size=8388608"
      - "--rocksdb.max-write-buffer-number=2"
      - "--rocksdb.block-cache-size=33554432"
      - "--cache.size=16777216"
      # Without this ArangoDB reads host RAM and sets a per-query AQL budget of
      # ~2.4 GB, ten times the container. 128 MiB keeps an oversized query to an
      # AQL error instead of a vanished process.
      - "--query.memory-limit=134217728"
      - "--server.statistics=false"
      - "--foxx.queues=false"
      - "--javascript.v8-contexts=2"
    volumes:
      - arango-data:/var/lib/arangodb3
    healthcheck:
      # /_api/version is 401 without credentials, and the image ships BusyBox wget
      # which has no --user/--password, so they go in the URL.
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null
           http://root:$$ARANGO_ROOT_PASSWORD@127.0.0.1:8529/_api/version || exit 1"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  falkordb:
    <<: *caps
    image: falkordb/falkordb:v4.20.4
    container_name: gb-falkordb
    ports:
      - "6380:6379"
    environment:
      # Defaults to one reader thread per core, so it would start 8 to share half
      # a core and measure scheduler contention instead of the engine.
      FALKORDB_ARGS: "THREAD_COUNT 1"
      REDIS_ARGS: "--maxmemory 200mb --save ''"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  neo4j-data:
  memgraph-data:
  arango-data:
  falkordb-data:
